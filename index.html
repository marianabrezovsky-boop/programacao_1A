<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEU SITE</title>
    <style>
        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #cf1089;
        }

        main {
            background-color: #FFFFFF;
            color: #082747;
            display: flex 1 1 25%;
        }

        img {
            width: 150px;
            height: 150px;
        }

        .AUTOR {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        
        <img src="imagem-blog.png" alt="um livro aberto">

        <div>
            <h2>Meu primeiro post</h2>
            <p class="AUTOR">Por: Mariana Maronezzi</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de
                tecnologia.</p>

        <button>🙂 <span>0</span> </button>
        </div>


    </main>

</body>

<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado() {
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }

</script>

</html>
